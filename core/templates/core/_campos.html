{% for campo in form %}
  <div>
    {% if campo.field.widget.input_type == 'checkbox' %}
      <label>{{ campo }} {{ campo.label }}</label>
    {% else %}
      <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}
    {% endif %}
    {% if campo.help_text %}<div class="ayuda">{{ campo.help_text }}</div>{% endif %}
    {{ campo.errors }}
  </div>
{% endfor %}
{{ form.non_field_errors }}
