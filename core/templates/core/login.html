{% extends "core/base.html" %}
{% load static %}
{% block titulo %}Ingresar · {{ NOMBRE_TIENDA }}{% endblock %}
{% block contenido %}
<div class="card" style="max-width:460px;margin:auto">
<p style="text-align:center;margin-top:0"><img src="{% static 'core/img/logo.png' %}" alt="{{ NOMBRE_TIENDA }}" style="max-width:260px;width:100%;height:auto;background:#fff;border-radius:10px"></p>
<h1>Ingresar</h1>
<form method="post">{% csrf_token %}{% include "core/_campos.html" %}
<p><button class="btn" type="submit">Ingresar</button></p></form>
<p class="ayuda">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate como cliente</a>.</p>
</div>
{% endblock %}
